<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure Landing Zone for PCI-DSS v4.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f172a;
  min-height: 100vh;
  color: #e2e8f0;
}
header {
  padding: 32px 20px 24px;
  background: linear-gradient(135deg, #111827 0%, #172554 100%);
  border-bottom: 1px solid #334155;
}
h1 { font-size: 2.2em; text-align: center; margin-bottom: 8px; }
h1 span { color: #4f8cff; }
.subtitle { color: #94a3b8; text-align: center; font-size: 1.1em; }
main { width: 100%; }
.viewer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 18px 20px;
}
.tabs { display: flex; gap: 8px; }
.tab {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 10px 16px;
  color: #e2e8f0;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
}
.tab:hover, .tab:focus-visible { border-color: #60a5fa; outline: none; }
.tab[aria-selected="true"] { background: #2563eb; border-color: #60a5fa; color: #fff; }
.open-link { color: #93c5fd; font-size: 0.9em; }
.diagram-panel { display: none; }
.diagram-panel.active { display: block; }
.diagram-frame {
  display: block;
  width: 100%;
  height: 1250px;
  border: 0;
  background: #fff;
}
.diagram-frame.simple { height: 900px; }
footer {
  padding: 24px 20px;
  color: #64748b;
  font-size: 0.85em;
  text-align: center;
  border-top: 1px solid #334155;
}
footer a { color: #4f8cff; text-decoration: none; }
@media (max-width: 700px) {
  h1 { font-size: 1.65em; }
  .viewer-toolbar { align-items: stretch; flex-direction: column; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; }
  .tab { padding: 10px 8px; }
  .open-link { text-align: right; }
  .diagram-frame { height: 1350px; }
  .diagram-frame.simple { height: 760px; }
}
</style>
</head>
<body>
  <header>
    <h1>☁️ Azure Landing Zone — <span>PCI-DSS v4.0</span></h1>
    <p class="subtitle">Interactive architecture visualizations for Payment24</p>
  </header>

  <main>
    <div class="viewer-toolbar">
      <div class="tabs" role="tablist" aria-label="Diagram views">
        <button class="tab" id="architecture-tab" type="button" role="tab" aria-selected="true" aria-controls="architecture-panel">Architecture</button>
        <button class="tab" id="simple-tab" type="button" role="tab" aria-selected="false" aria-controls="simple-panel">Simple explanation</button>
      </div>
      <a class="open-link" id="open-link" href="architecture-diagram.html" target="_blank" rel="noopener">Open current view in a new tab</a>
    </div>

    <section class="diagram-panel active" id="architecture-panel" role="tabpanel" aria-labelledby="architecture-tab">
      <iframe class="diagram-frame" src="architecture-diagram.html" title="Interactive PCI-DSS Azure landing zone architecture"></iframe>
    </section>
    <section class="diagram-panel" id="simple-panel" role="tabpanel" aria-labelledby="simple-tab" hidden>
      <iframe class="diagram-frame simple" src="landing-zone-explained-for-kids.html" title="Azure landing zone explained simply" loading="lazy"></iframe>
    </section>
  </main>

  <footer>
    <p>Repository: <a href="https://github.com/microsoftmrinal/azure-landing-zone-pci-dss">microsoftmrinal/azure-landing-zone-pci-dss</a></p>
  </footer>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');
    const openLink = document.getElementById('open-link');

    function selectTab(selectedTab) {
      tabs.forEach((tab) => {
        const selected = tab === selectedTab;
        const panel = document.getElementById(tab.getAttribute('aria-controls'));
        tab.setAttribute('aria-selected', selected);
        panel.classList.toggle('active', selected);
        panel.hidden = !selected;
      });

      openLink.href = selectedTab.id === 'architecture-tab'
        ? 'architecture-diagram.html'
        : 'landing-zone-explained-for-kids.html';

      history.replaceState(null, '', selectedTab.id === 'architecture-tab' ? '#architecture' : '#simple');
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        const currentIndex = Array.from(tabs).indexOf(tab);
        const offset = event.key === 'ArrowRight' ? 1 : -1;
        const nextTab = tabs[(currentIndex + offset + tabs.length) % tabs.length];
        nextTab.focus();
        selectTab(nextTab);
      });
    });

    function selectTabFromHash() {
      selectTab(document.getElementById(location.hash === '#simple' ? 'simple-tab' : 'architecture-tab'));
    }

    window.addEventListener('hashchange', selectTabFromHash);
    selectTabFromHash();
  </script>
</body>
</html>
