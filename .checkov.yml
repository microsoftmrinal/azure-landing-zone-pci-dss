soft-fail: false
framework:
  - terraform
skip-check:
  # CKV_AZURE_50: VM Extensions - we use Defender auto-provisioning which
  # installs the MDE agent; this is required for PCI DSS Req 5 (anti-malware)
  - CKV_AZURE_50

  # CKV_AZURE_224: Ledger feature - not applicable; this is a payment processing
  # database, not a blockchain audit scenario. Immutable audit is handled by WORM storage.
  - CKV_AZURE_224

  # CKV2_AZURE_31: NSG on subnets - skip for Azure-managed subnets only:
  # AzureFirewallManagementSubnet, AzureBastionSubnet, dns-resolver (delegated)
  # and snet-pls (Private Link Service NAT subnet; network policies must be disabled).
  # These subnets do not support user-assigned NSGs per Azure platform constraints.
  # All other workload subnets (PE, compute) DO have NSGs assigned.
  - CKV2_AZURE_31
